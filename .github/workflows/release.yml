name: Release

# Builds the archives behind the install scripts. A `v*` tag publishes them to its
# GitHub release. Anything else only builds and smoke tests them.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "apps/heddle_local/**"
      - "config/runtime.exs"
      - "mix.exs"
      - "mix.lock"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-22.04 }
          - { target: linux-arm64, runner: ubuntu-22.04-arm }
          - { target: macos-arm64, runner: macos-14 }
          - { target: windows-x64, runner: windows-2022 }

    defaults:
      run:
        shell: bash

    env:
      MIX_ENV: prod

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4"
          elixir-version: "1.18.3"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pythonx compiles a NIF, which needs nmake and the compiler on PATH.
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Build the release
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod
          npm ci --prefix apps/heddle_ui/assets
          mix do tailwind.install --if-missing + esbuild.install --if-missing
          mix compile
          mix assets.deploy
          mix release heddle --overwrite

      - run: scripts/package_release.sh ${{ matrix.target }}

      - run: scripts/smoke_release.sh dist/heddle-${{ matrix.target }}.tar.gz

      # TEMPORARY: first run of install.ps1 on real Windows, as a user with an accent.
      - if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: heddlehq/website
          ref: feat/one-line-install
          path: website

      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process python -ArgumentList '-m','http.server','8931','--bind','127.0.0.1','--directory','dist' -WindowStyle Hidden
          Start-Sleep 3
          $env:HEDDLE_DOWNLOAD_URL = 'http://127.0.0.1:8931'
          $env:HEDDLE_NO_START = '1'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'Usuário João'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          Get-Content website/web/public/install.ps1 -Raw | Invoke-Expression
          $installed = Join-Path $env:ProgramData 'Heddle'
          & cmd /c "`"$installed\app\heddle.cmd`" version"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          icacls $installed

      - uses: actions/upload-artifact@v4
        with:
          name: heddle-${{ matrix.target }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --clobber
