name: Release

# Builds what `heddle install` downloads, and that command itself. A `v*` tag publishes them to its
# GitHub release. Anything else only builds and smoke tests them.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "apps/heddle_local/**"
      - "cli/**"
      - "config/runtime.exs"
      - "mix.exs"
      - "mix.lock"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-22.04 }
          - { target: linux-arm64, runner: ubuntu-22.04-arm }
          - { target: macos-arm64, runner: macos-15 }
          - { target: windows-x64, runner: windows-2022 }

    defaults:
      run:
        shell: bash

    env:
      MIX_ENV: prod

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4"
          elixir-version: "1.18.3"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # Pythonx compiles a NIF, which needs nmake and the compiler on PATH.
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Build the release
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod
          npm ci --prefix apps/heddle_ui/assets
          mix do tailwind.install --if-missing + esbuild.install --if-missing
          mix compile
          mix assets.deploy
          mix release heddle --overwrite

      - run: scripts/package_release.sh ${{ matrix.target }}

      - run: scripts/smoke_release.sh dist/heddle-${{ matrix.target }}.tar.gz dist/heddle-cli-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: heddle-${{ matrix.target }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --clobber
