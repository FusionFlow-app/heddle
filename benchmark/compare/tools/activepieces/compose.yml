services:
  app:
    image: ghcr.io/activepieces/activepieces:0.92.3
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      AP_ENGINE_EXECUTABLE_PATH: dist/packages/engine/main.js
      AP_API_KEY: benchbenchbenchbenchbenchbenchbenchbench
      AP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      AP_JWT_SECRET: benchbenchbenchbenchbenchbenchbenchbench
      AP_ENVIRONMENT: prod
      AP_FRONTEND_URL: http://127.0.0.1:18080
      AP_WEBHOOK_TIMEOUT_SECONDS: 30
      AP_TRIGGER_DEFAULT_POLL_INTERVAL: 5
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_HOST: db
      AP_POSTGRES_PORT: 5432
      AP_POSTGRES_USERNAME: postgres
      AP_POSTGRES_PASSWORD: postgres
      AP_EXECUTION_MODE: UNSANDBOXED
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: 6379
      AP_TELEMETRY_ENABLED: "false"
    ports: ["18080:80"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: activepieces }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d activepieces"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
