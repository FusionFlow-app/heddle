# The same services and defaults as the root docker-compose.yml.
services:
  ui:
    image: heddle:bench
    environment:
      DATABASE_URL: ecto://postgres:postgres@db/heddle
      UI_POOL_SIZE: 10
      PORT: 4000
      PHX_SERVER: "true"
      HEDDLE_MODE: ui
    ports: ["18080:4000"]
    depends_on:
      db: { condition: service_healthy }
    volumes: ["data:/app/data"]
  worker:
    image: heddle:bench
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DATABASE_URL: ecto://postgres:postgres@db/heddle
      WORKER_POOL_SIZE: 10
      OBAN_DEFAULT_CONCURRENCY: 2
      OBAN_EXECUTIONS_CONCURRENCY: 50
      OBAN_RESCUE_AFTER_MINUTES: ${HEDDLE_RESCUE_MINUTES:-60}
      HEDDLE_MODE: worker
    depends_on:
      db: { condition: service_healthy }
    volumes: ["data:/app/data"]
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: heddle }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heddle"]
      interval: 2s
      retries: 30
volumes:
  data:
