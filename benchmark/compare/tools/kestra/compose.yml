services:
  kestra:
    image: kestra/kestra:v2.0.9
    command: server standalone
    user: root
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://db:5432/kestra
            driverClassName: org.postgresql.Driver
            username: postgres
            password: postgres
        kestra:
          server:
            basicAuth:
              username: bench@example.com
              password: BenchPass1234
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              basePath: /tmp/kestra-storage
    ports: ["18080:8080"]
    depends_on:
      db: { condition: service_healthy }
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: kestra }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kestra"]
      interval: 2s
      retries: 30
