# `docker compose up -d --build` is all a local install needs. Settings are
# optional, see .env.example. For development, docker-compose.dev.yml publishes
# the database to this machine.

x-heddle: &heddle
  build:
    context: .
    dockerfile: Dockerfile
  image: heddle:latest
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - heddle_data:/app/data

x-env: &env
  DATABASE_URL: ecto://postgres:postgres@db/heddle
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
  HEDDLE_LLM_PROVIDER: ${HEDDLE_LLM_PROVIDER:-}
  HEDDLE_LLM_MODEL: ${HEDDLE_LLM_MODEL:-}
  HEDDLE_LLM_API_KEY: ${HEDDLE_LLM_API_KEY:-}
  HEDDLE_CLAUDE_API_KEY: ${HEDDLE_CLAUDE_API_KEY:-}
  HEDDLE_CLAUDE_BIN: ${HEDDLE_CLAUDE_BIN:-}
  HEDDLE_CLAUDE_MAX_BUDGET_USD: ${HEDDLE_CLAUDE_MAX_BUDGET_USD:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}

x-ui-env: &ui-env
  UI_POOL_SIZE: 10
  PHX_HOST: ${PHX_HOST:-}
  PORT: 4000
  PHX_SERVER: "true"

x-worker-env: &worker-env
  WORKER_POOL_SIZE: 3
  OBAN_DEFAULT_CONCURRENCY: 2
  OBAN_EXECUTIONS_CONCURRENCY: 5

services:
  ui:
    <<: *heddle
    environment:
      <<: [*env, *ui-env]
      HEDDLE_MODE: ui
    ports:
      - "${HEDDLE_PORT:-4000}:4000"

  worker:
    <<: *heddle
    environment:
      <<: [*env, *worker-env]
      HEDDLE_MODE: worker

  all:
    <<: *heddle
    profiles: ["all"]
    environment:
      <<: [*env, *ui-env, *worker-env]
    ports:
      - "${HEDDLE_PORT:-4000}:4000"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: heddle
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heddle"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  heddle_data:
